[package]
name = "maestro-desktop"
version = "0.2.2"
description = "Maestro 桌面指挥台（Windows 客户端）"
edition = "2021"
license = "Apache-2.0"
default-run = "maestro-desktop"

[lib]
name = "maestro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maestro-protocol = { path = "../../crates/maestro-protocol" }
maestro-client = { path = "../../crates/maestro-client" }

[profile.release]
lto = "thin"
strip = true
