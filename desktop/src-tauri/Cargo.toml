[package]
name = "maestro-desktop"
version = "0.2.4"
description = "Maestro 桌面指挥台（Windows 客户端）"
edition = "2021"
license = "Apache-2.0"
default-run = "maestro-desktop"

[lib]
name = "maestro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon（Sprint C C3-1）：托盘常驻 —— 关窗最小化、菜单动作、状态角标
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maestro-protocol = { path = "../../crates/maestro-protocol" }
maestro-client = { path = "../../crates/maestro-client" }

[profile.release]
lto = "thin"
strip = true
