# Release pipeline skeleton (Sprint C C0-4; matrix = C0-1 single source).
#
# Triggered by tag v*. This iteration defines STRUCTURE only:
#   matrix build -> artifacts -> (sign slots) -> archive
# - Signing slots (C1-6 Windows Authenticode / C2-5 macOS notarization) call
#   the degrade-aware scripts: without secrets they emit a loud UNSIGNED
#   marker and exit 0, so dry-runs run through the pre-signing steps (C0-4
#   acceptance) without pretending anything was signed.
# - macOS universal sidecars (C2-4 lipo) and notarize (C2-5) are TODO slots;
#   jobs are laid out so they slot in without restructuring.
# - The final job is intentionally a dry-run gate: it validates artifacts
#   and prints a summary. Actual GitHub Release upload stays on the local
#   pipeline (gh-release.cjs) until C5 moves it here.
#
# Release matrix (C0-1, single source of truth for triples):
#   windows x64    -> x86_64-pc-windows-msvc   (NSIS)
#   windows arm64  -> aarch64-pc-windows-msvc (NSIS)
#   macOS universal-> aarch64-apple-darwin + x86_64-apple-darwin (lipo, TODO C2-4)
#   linux x64      -> x86_64-unknown-linux-gnu (AppImage/deb/rpm)

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build + verify, skip release steps'
        required: false
        default: 'true'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: build windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: windows-latest
            triple: x86_64-pc-windows-msvc
          - arch: arm64
            runs-on: windows-11-arm
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build sidecars (daemon/rounder/mock-cli)
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.triple }} -p maestro-daemon --bin maestro-daemon --bin maestro-rounder
          # mock-cli 属 desktop crate（不在 workspace 成员内）—— 按 manifest 构建
          cargo build --release --target ${{ matrix.triple }} --manifest-path desktop/src-tauri/Cargo.toml --bin mock-cli
          New-Item -ItemType Directory -Force desktop/src-tauri/bin | Out-Null
          Copy-Item "target/${{ matrix.triple }}/release/maestro-daemon.exe" "desktop/src-tauri/bin/maestro-daemon-${{ matrix.triple }}.exe" -Force
          Copy-Item "target/${{ matrix.triple }}/release/maestro-rounder.exe" "desktop/src-tauri/bin/maestro-rounder-${{ matrix.triple }}.exe" -Force
          Copy-Item "target/${{ matrix.triple }}/release/mock-cli.exe" "desktop/src-tauri/bin/mock-cli-${{ matrix.triple }}.exe" -Force
      - name: Build installer (NSIS)
        working-directory: desktop
        run: |
          npm ci
          npx tauri build
      - name: Sign installer (degrades to unsigned without secrets)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PFX_PATH: ${{ secrets.WINDOWS_CERT_PFX_PATH }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign-windows.ps1 -Path $exe.FullName
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    name: build macOS (arm64; universal + notarize TODO C2-4/C2-5)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build sidecars (arm64; lipo universal TODO C2-4)
        run: |
          cargo build --release --target aarch64-apple-darwin -p maestro-daemon --bin maestro-daemon --bin maestro-rounder
          # TODO(C2-4): cargo build x86_64 + lipo -create for all three sidecars
          # TODO(C2-2/C2-3): Developer ID sign sidecars inside-out, hardened runtime
          # TODO(C2-5/C2-6): notarytool submit + stapler for .app and DMG
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-sidecars-arm64
          path: target/aarch64-apple-darwin/release/maestro-*
          if-no-files-found: error

  build-linux:
    name: build linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux GUI deps (webkit2gtk for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build sidecars + packages (B4 script, single source of truth)
        run: |
          chmod +x desktop/scripts/prepare-sidecars.sh desktop/scripts/build-linux.sh
          ./desktop/scripts/build-linux.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # Dry-run gate (C0-4 acceptance): everything above must run green up to the
  # signing slots. Release publishing stays on the local pipeline (gh-release.cjs)
  # until C5-2/C5-3 harden cross-platform parity.
  verify:
    name: verify artifacts (dry-run gate)
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Summary
        run: |
          echo "=== Release dry-run artifact summary ==="
          find artifacts -type f -exec ls -la {} \;
          echo "DRY_RUN_COMPLETE=ok (publishing stays on local pipeline until C5)"
