# CI 矩阵（R57 + Sprint C C1-8 转正）：三平台「更容易测试发现问题」的基础设施。
#
# 设计：
# - build+clippy：三平台全阻塞 —— Windows/macOS 的编译兼容问题在 PR 就暴露
# - test (linux)：全量测试，阻塞（锚点平台）
# - test (windows)：全量阻塞（C1-8 转正）—— Job Objects 进程面测试 5 项
#   已在 x64 runner 实证通过；Windows 回归成为硬门
# - test (cross/macos)：试验性（continue-on-error），转正留 C5-3

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build+clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (all targets)
        run: cargo build --workspace --all-targets
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: test (ubuntu-latest, full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (full suite)
        run: cargo test --workspace --no-fail-fast

  # C1-8 转正（C5-3 部分提前）：Windows 进程面测试（worker Job Objects
  # 冻结/整组终止/两级关闭等 5 项）已在 x64 runner 实证通过（b13d665 run），
  # 从 continue-on-error 提升为阻塞 —— Windows 回归成为硬门。
  test-windows:
    name: test (windows-latest, full)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        # --no-fail-fast：一次暴露该平台全部失败（而非一轮修一个）
        run: cargo test --workspace --no-fail-fast

  # macOS full 仍为试验性（转正留 C5-3：需连续多轮绿后评估）
  test-cross:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-latest, full
            os: macos-latest
    runs-on: ${{ matrix.os }}
    continue-on-error: true # 试验性：跨平台差距先可见，转正后移除
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        # --no-fail-fast：一次暴露该平台全部失败（而非一轮修一个）
        run: cargo test --workspace --no-fail-fast

  # C5-3 前置（Linux C4-2 冒烟）：deb 安装包「装得上、桌面项正确、卸得干净」。
  # 只在 push master 跑（PR 走 build+clippy 已覆盖编译面；bundle 全链耗时较长）。
  # AppImage 全链（无 FUSE 提取指引）与 rpm 实机验证属 C4-5 手动实测范围。
  bundle-smoke-linux:
    name: bundle smoke (ubuntu, deb)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop/src-tauri
      - name: Install GUI build deps (webkit2gtk 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build deb bundle
        run: |
          cd desktop
          npm ci
          ./scripts/build-linux.sh deb
      - name: Install & verify
        run: |
          DEB="$(find desktop/src-tauri/target/release/bundle/deb -name '*.deb' | head -1)"
          # realpath 转绝对路径：无 ./ 前缀的相对路径会被 apt 按「包名/版本」
          # 语法解析（最后斜杠=版本分隔符）→ "Unable to locate package <目录>"。
          # 本机预演用 $(pwd)/ 前缀未暴露，CI find 返回相对路径首跑即挂（37459589464）
          DEB="$(realpath "$DEB")"
          echo "installing $DEB"
          sudo apt-get install -y "$DEB"
          # .desktop 元数据（C4-2）：Categories / StartupNotify 落包
          DESKTOP="$(find /usr/share/applications -iname 'maestro.desktop' | head -1)"
          echo "desktop file: $DESKTOP"
          test -n "$DESKTOP"
          grep -q '^StartupNotify=true$' "$DESKTOP"
          grep -q '^Categories=.*Development' "$DESKTOP"
          # 主二进制可执行（版本自检，不起 GUI —— runner 无显示服务器）。
          # 主程序名 = cargo 产物名 maestro-desktop（productName 只进包名/菜单）
          test -x /usr/bin/maestro-desktop && /usr/bin/maestro-desktop --version
          # sidecar 裸名同目录落包（tools.rs resolve_tool 第二候选命中）
          test -x /usr/bin/maestro-daemon && test -x /usr/bin/maestro-rounder
          # 依赖解析干净（deb depends 声明有效性）
          dpkg -s maestro | grep -E '^Status: install ok installed$'
      - name: Uninstall & verify clean
        run: |
          sudo dpkg -r maestro
          # 卸载无残留：desktop 项与二进制随包移除
          ! find /usr/share/applications -iname 'maestro.desktop' | grep -q .
          ! ls /usr/bin/maestro-desktop /usr/bin/maestro-daemon /usr/bin/maestro-rounder 2>/dev/null

  # C7 效果基准集（mock 模式）：10 任务全链跑 + 验收通过率 ≥98% 作门禁
  # （maestro-bench 退出码 1 = 套件退化 → 本 job 失败）。确定性可复跑
  # （无 API key、fixture 自带），套件破坏（红绿不变量破、验收退化）当轮暴露。
  # node 任务验收需 Node ≥18（--test）；git 物化用 runner 预装。
  benchmark:
    name: benchmark (ubuntu, mock)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build runner + worker binaries
        # 显式预构建（runner 主 bin / rounder / bench-worker），避免 ensure_bin
        # 在 CI 首跑时走兜底自举
        run: |
          cargo build -p maestro-daemon --bin maestro-rounder
          cargo build -p maestro-bench --bins
      - name: Run benchmark suite (acceptance gate >= 98%)
        run: cargo run -p maestro-bench -- --report-dir target/bench-report
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: target/bench-report/
          if-no-files-found: warn
