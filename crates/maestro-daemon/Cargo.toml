[package]
name = "maestro-daemon"
description = "Maestro 守护进程：事件循环、Worker 运行时、急停、checkpoint、持久化"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
maestro-protocol.workspace = true
maestro-client.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true
ureq.workspace = true

# Unix 进程组信号/进程管理（Windows 走 worker.rs 的 Job Objects 语义）
[target.'cfg(unix)'.dependencies]
nix.workspace = true

# Windows Job Objects：急停真冻结（逐线程挂起）+ 整组终止 + kill-on-close 防孙进程泄漏
# （Sprint C C1-1：feature 最小集，非 Windows 构建零影响。Security 为 CreateJobObjectW 的
# SECURITY_ATTRIBUTES 参数类型所需）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[[bin]]
name = "maestro-daemon"
path = "src/main.rs"

[[bin]]
name = "maestro-rounder"
path = "src/bin/rounder.rs"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
