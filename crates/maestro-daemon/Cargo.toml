[package]
name = "maestro-daemon"
description = "Maestro 守护进程：事件循环、Worker 运行时、急停、checkpoint、持久化"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
maestro-protocol.workspace = true
maestro-client.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true
ureq.workspace = true

# Unix 进程组信号/进程管理（Windows 走 worker.rs 的 Child 注册表降级路径）
[target.'cfg(unix)'.dependencies]
nix.workspace = true

[[bin]]
name = "maestro-daemon"
path = "src/main.rs"

[[bin]]
name = "maestro-rounder"
path = "src/bin/rounder.rs"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
