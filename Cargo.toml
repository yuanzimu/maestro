[workspace]
resolver = "2"
members = [
    "crates/maestro-protocol",
    "crates/maestro-daemon",
    "crates/maestro-client",
    "crates/maestro-cli",
    "crates/maestro-testkit",
    "crates/maestro-e2e",
]
exclude = ["reference/herdr"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
maestro-protocol = { path = "crates/maestro-protocol" }
maestro-daemon = { path = "crates/maestro-daemon" }
maestro-client = { path = "crates/maestro-client" }
maestro-testkit = { path = "crates/maestro-testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29", features = ["signal", "process", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = "thin"
strip = true
